<div class="login-wrapper" id="loginWrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo"></div>
      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa tus credenciales para acceder a TiendaAdmin</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="loginName">Usuario</label>
        <input type="text" id="loginName" name="name" placeholder="Ej: admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-login">
        Iniciar Sesión
      </button>

      <div id="loginFeedback" class="feedback-message" style="display: none;"></div>
    </form>
  </div>
</div>
