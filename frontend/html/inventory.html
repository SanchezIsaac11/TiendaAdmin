<section class="inventory-section">
  <div class="grid-layout">
    <div class="card">
      <h3 id="formTitle">Nuevo Producto</h3>
      <form id="productForm">
        <div class="form-group">
          <label for="barcode">Código de Barras</label>
          <input type="text" id="barcode" name="barcode" placeholder="Ej: 750103912089">
        </div>

        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" placeholder="Ej: Leche Lala Entera 1L" required>
        </div>

        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category" name="category" required>
            <option value="">Cargando categorías...</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="price">Precio ($)</label>
            <input type="number" id="price" name="price" placeholder="29.50" min="0.01" step="0.01" required>
          </div>

          <div class="form-group">
            <label for="cost">Costo ($)</label>
            <input type="number" id="cost" name="cost" placeholder="22.00" min="0.01" step="0.01" required>
          </div>

          <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" placeholder="30" min="1" step="1" required>
          </div>
        </div>

        <div id="priceCostAlert" class="price-cost-alert"></div>

        <div class="form-actions">
          <button type="submit" id="btnSubmit" class="btn btn-primary">
            Guardar Producto
          </button>
          <button type="button" id="btnCancelEdit" class="btn btn-secondary" style="display: none;">
            Cancelar
          </button>
        </div>

        <div id="feedbackMessage" class="feedback-message" style="display: none;"></div>
      </form>
    </div>

    <div class="card">
      <div class="table-header-row">
        <h3>Lista de Productos</h3>
      </div>

      <div class="table-wrapper">
        <table class="products-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr>
              <td colspan="6" class="loading-cell"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
