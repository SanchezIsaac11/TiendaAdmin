<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaAdmin</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/inventory.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo"></span>
        <h2 class="sidebar-title">TiendaAdmin</h2>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="inventory">
          <span class="nav-icon"></span>
          <span class="nav-label">Inventario</span>
        </button>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="main-header">
        <button class="btn-menu" id="btnMenu" title="Menú">☰</button>
        <h1 class="main-header-title" id="sectionTitle">Inventario</h1>
      </header>

      <div class="section-content" id="sectionContent">
        
        <div class="loading-section">Cargando...</div>
      </div>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script src="./config/config.js"></script>
</body>
</html>
