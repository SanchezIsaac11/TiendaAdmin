<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaAdmin</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/inventory.css">
  <link rel="stylesheet" href="./css/sales.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div id="loginRoot"></div>

  <div class="app-layout" id="appLayout" style="display: none;">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">TiendaAdmin</h2>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="inventory">
          <span class="nav-icon">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="m12 3 9 5-9 5-9-5 9-5Z"/>
                <path d="m3 8 9 5 9-5"/>
                <path d="M12 13v9"/>
                <path d="m3 8 0 10 9 4"/>
                <path d="m21 8 0 10-9 4"/>
            </svg>
          </span>
          <span class="nav-label">Inventario</span>
        </button>

        <button class="nav-item" data-section="sales">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          <span class="nav-label">Historial de Ventas</span>
        </button>
      </nav>

      <div class="sidebar-footer" id="sidebarFooter">
        <div class="user-info">
          <div class="user-details">
            <span class="user-name" id="sidebarUserName">Usuario</span>
            <span class="user-role" id="sidebarUserRole">Rol</span>
          </div>
        </div>
        <button class="btn-logout" id="btnLogout" title="Cerrar Sesión">
          Salir
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="main-header">
        <button class="btn-menu" id="btnMenu" title="Menú">☰</button>
        <h1 class="main-header-title" id="sectionTitle">Inventario</h1>
      </header>

      <div class="section-content" id="sectionContent">
        <div class="loading-section">Cargando...</div>
      </div>
    </main>
  </div>

  <script src="./config/config.js"></script>
  <script src="./js/appState.js"></script>
  <script src="./js/login/checkSession.js"></script>
  <script src="./js/login/login.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
